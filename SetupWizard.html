<!doctype html><html><head><base target="_top"><meta charset="utf-8"><style>
body{font:14px Arial,'Noto Sans JP',sans-serif;color:#202124;padding:20px;margin:0}h2{margin:0 0 8px}p{line-height:1.6}.muted{color:#60646c}.steps{display:flex;gap:6px;margin:16px 0}.step{flex:1;background:#e8eaed;border-radius:8px;padding:8px 4px;text-align:center;font-size:11px}.step.done{background:#e3f2e8}.step.active{background:#dbeafe;font-weight:bold}.panel{background:#f7f8fa;border-radius:10px;padding:18px;min-height:200px}label{display:block;font-weight:bold;margin:12px 0 5px}input,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #aab0b6;border-radius:6px;background:white;font-size:14px}.actions{display:flex;justify-content:space-between;margin-top:18px}button{padding:10px 18px;border:0;border-radius:6px;cursor:pointer;background:#1769aa;color:white}button.secondary{background:#e8eaed;color:#202124}button:disabled{opacity:.45;cursor:default}.error{color:#b3261e;white-space:pre-wrap;margin-top:12px}.ok{color:#137333}.tiny{font-size:12px}.path{padding:10px;background:white;border-radius:5px;overflow-wrap:anywhere}
</style></head><body><h2>S3 初回セットアップ</h2><div class="muted tiny">設定済みの項目は引き継ぎ、未完了のところから再開します。</div><div class="steps" id="steps"></div><div id="panel" class="panel">設定を確認しています…</div><div class="error" id="error" role="alert"></div><div class="actions"><button class="secondary" id="back" onclick="back()">戻る</button><button id="next" onclick="next()">次へ</button></div>
<script>
let status=null,sites=[],step=0,manager=null,busy=false;
const titles=['GSCサイト','ブログ名','SBM接続','保存先','完了'];
function el(id){return document.getElementById(id)}
function safe(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function error(e){busy=false;el('error').textContent=(e&&e.message)||String(e);draw()}
function invoke(fn,args,done){busy=true;el('error').textContent='';draw();let runner=google.script.run.withFailureHandler(error).withSuccessHandler(x=>{busy=false;done(x)});runner[fn].apply(runner,args||[])}
function init(){invoke('sssWizardStatus_',[],s=>{status=s;if(s.storageReady)step=4;else if(s.locked)step=2;else step=0; if(!s.locked)loadSites();else draw()})}
function loadSites(){invoke('sssWizardSites_',[],v=>{sites=v||[];draw()})}
function draw(){if(!status)return;el('steps').innerHTML=titles.map((t,i)=>'<div class="step '+(i<step?'done':i===step?'active':'')+'">'+(i<step?'✓ ':'')+safe(t)+'</div>').join('');let h='';
if(step===0){h='<h3>1. GSCの対象サイトを選択</h3><p>Search Consoleに登録されているサイトを選んでください。</p><label>対象サイト</label><select id="site">'+sites.map(x=>'<option value="'+safe(x.uri)+'">'+safe(x.uri)+'</option>').join('')+'</select>';if(!sites.length)h+='<p>サイトを読み込めませんでした。権限を確認してください。</p>'}
if(step===1){h='<h3>2. ブログ名を入力</h3><p>SBMで登録したブログ名と同じ名前を入力してください。</p><label>ブログ名</label><input id="blog" maxlength="100" placeholder="例：ガジェット探検記"><p class="muted tiny">確定後は通常操作で変更できません。</p>'}
if(step===2){h='<h3>3. SBMとの接続</h3><p>SBMのスプレッドシートを開き、ブラウザのアドレス欄からURLをコピーして貼り付けてください。IDだけでも入力できます。</p><div class="path">登録サイト：'+safe(status.siteName)+'<br>GSC：'+safe(status.propertyUri)+'</div><label>SBMのスプレッドシートURLまたはID</label><input id="manager" placeholder="https://docs.google.com/spreadsheets/d/…/edit"><p class="muted tiny">ブログ名・GSCプロパティ・URL範囲を照合します。SBMのデータは変更しません。</p>';if(manager)h+='<p class="ok">照合済み：'+safe(manager.blogName)+'（'+safe(manager.blogUrl)+'）</p>'}
if(step===3){h='<h3>4. 保存先を確認</h3><p class="ok">SBMのサイト設定と一致しています。</p><div class="path">SIMS ／ '+safe(status.siteName)+' ／ Strategist</div><p>SBMの既存ブログフォルダー内に、S3専用のStrategistフォルダーを作成します。既存データは移動・削除しません。</p><p class="muted tiny">既存のStrategistがある場合や、フォルダー名が重複している場合は停止します。</p>'}
if(step===4){h='<h3 class="ok">セットアップ完了</h3><p>対象：'+safe(status.siteName)+'</p><p>GSC：'+safe(status.propertyUri)+'</p><div class="path">保存先：SIMS ／ '+safe(status.folderName)+' ／ Strategist</div><p>メニューからGSCデータ収集を開始できます。</p>'}
el('panel').innerHTML=h;el('back').disabled=busy||step===0||status.storageReady||status.locked&&step<=2;el('next').disabled=busy||(step===0&&!sites.length);el('next').textContent=step===4?'閉じる':step===2?'SBMを照合':step===3?'保存先を確定':'次へ';}
function back(){if(step>0&&!busy){step--;draw()}}
function next(){if(busy)return;if(step===0){const v=el('site').value;if(!v)return;window.selectedSite=v;step=1;draw();return}if(step===1){const name=el('blog').value.trim();if(!name){el('error').textContent='ブログ名を入力してください。';return}if(!confirm('次のサイトを固定します。確定後は通常操作で変更できません。\n'+selectedSite+'\n'+name+'\n続行しますか？'))return;invoke('sssWizardBind_',[selectedSite,name],s=>{status=s;step=2;draw()});return}if(step===2){const value=el('manager').value.trim();if(!value){el('error').textContent='SBMのURLまたはIDを入力してください。';return}invoke('sssWizardCheckManager_',[value],x=>{manager=x;step=3;draw()});return}if(step===3){if(!manager){el('error').textContent='SBMの照合が必要です。';return}if(!confirm('SBMの既存ブログフォルダー内にStrategistを作成します。よろしいですか？'))return;invoke('sssWizardCreateStorage_',[manager.managerSpreadsheetId],s=>{status=s;step=4;draw()});return}google.script.host.close()}
init();
</script></body></html>
